<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="icon" href="assets/sun.png" type="image/png">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div class="SearchCity">
        <input type="text" placeholder="Enter Your City:" spellcheck="false" id="searchByCity" />
        <button id="Btn">
          <img src="assets/search.png" alt="Search Button" />
        </button>
      </div>
      <div class="weather">
        <img class="icon" id="icon" src="assets/rain.png" alt="Weather Icon" />
        <h1 id="temp">22°C</h1>
        <h2 id="city">New York</h2>
        <div class="extra">
          <div class="extraColumn">
            <img src="assets/humidity.png" alt="Humidity Icon" />
            <div>
              <p class="humidity">50%</p>
              <p>Humidity</p>
            </div>
          </div>
          <div class="extraColumn">
            <img src="assets/wind.png" alt="Wind Speed Icon" />
            <div>
              <p class="Wind">15 km/h</p>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
  <script src="script.js"></script>
</html>
